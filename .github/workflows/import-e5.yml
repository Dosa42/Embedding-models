name: Import E5 model
on:
  push:
    paths:
      - .github/workflows/import-e5.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit model
        shell: bash
        run: |
          set -euo pipefail
          revision=761b726dd34fb83930e26aab4e9ac3899aa1fa78
          base=https://huggingface.co/Xenova/multilingual-e5-small/resolve/$revision
          target=multilingual-e5-small-int8
          mkdir -p "$target/onnx"
          for name in config.json special_tokens_map.json tokenizer.json tokenizer_config.json; do
            curl --fail --location --retry 3 "$base/$name" --output "$target/$name"
          done
          curl --fail --location --retry 3 "$base/onnx/model_int8.onnx" --output "$target/onnx/model_int8.onnx"
          echo "4d24e2bc01a447951524466ef533e52944bf48509e6552810bcee1a2711cb02c  $target/onnx/model_int8.onnx" | sha256sum --check
          (cd "$target/onnx" && zip -q -9 model_int8.onnx.zip model_int8.onnx)
          test "$(stat -c %s "$target/onnx/model_int8.onnx.zip")" -lt 100000000
          rm "$target/onnx/model_int8.onnx"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "Add multilingual E5 small int8 model archive"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi