name: Import MiniLM L6 v2
on:
  push:
    paths:
      - .github/workflows/import-minilm.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit model
        shell: bash
        run: |
          set -euo pipefail
          revision=1110a243fdf4706b3f48f1d95db1a4f5529b4d41
          base=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/$revision
          target=all-MiniLM-L6-v2
          mkdir -p "$target/onnx" "$target/1_Pooling"
          for name in model.safetensors tokenizer.json tokenizer_config.json vocab.txt config.json config_sentence_transformers.json modules.json sentence_bert_config.json special_tokens_map.json; do
            curl --fail --location --retry 3 "$base/$name" --output "$target/$name"
          done
          curl --fail --location --retry 3 "$base/onnx/model.onnx" --output "$target/onnx/model.onnx"
          curl --fail --location --retry 3 "$base/1_Pooling/config.json" --output "$target/1_Pooling/config.json"
          echo "6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452  $target/onnx/model.onnx" | sha256sum --check
          echo "53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db  $target/model.safetensors" | sha256sum --check
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add "$target"
          git commit -m "Add all-MiniLM-L6-v2 embedding model"
          git push origin HEAD:main