name: Build six INT8 ONNX models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-six-int8-models.yml
      - scripts/build_six_int8_models.py
      - scripts/six_int8_models.json
      - scripts/six-int8-requirements.txt

permissions:
  contents: write

concurrency:
  group: six-int8-standalone-models
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/six-int8-requirements.txt
      - name: Install ONNX conversion and validation tools
        run: python -m pip install -r scripts/six-int8-requirements.txt
      - name: Download, convert, execute and package all six models
        run: python scripts/build_six_int8_models.py
      - name: Preserve six complete ZIPs and validation report
        uses: actions/upload-artifact@v4
        with:
          name: six-int8-onnx-models
          path: |
            standalone-models/*-int8-standalone.zip
            standalone-models/six-int8-models.lock.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish complete ZIPs in standalone-models using Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -c 'import json; print("\n".join(p["name"] for p in json.load(open("standalone-models/six-int8-models.lock.json"))["packages"]))' > "$RUNNER_TEMP/six-int8-assets.txt"
          while IFS= read -r asset; do
            git add --sparse -- "standalone-models/$asset"
          done < "$RUNNER_TEMP/six-int8-assets.txt"
          git add --sparse standalone-models/six-int8-models.lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Store six validated INT8 ONNX standalone models'
            git pull --rebase origin main
            git lfs push origin HEAD
            git push origin HEAD:main
          fi
          git fetch origin main
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('standalone-models/six-int8-models.lock.json').read_text())
          for item in report['packages']:
              pointer = subprocess.check_output(['git', 'show', 'origin/main:standalone-models/' + item['name']], text=True)
              expected = f"version https://git-lfs.github.com/spec/v1\noid sha256:{item['sha256']}\nsize {item['size']}\n"
              if pointer != expected:
                  raise ValueError('Published LFS pointer mismatch: ' + item['name'])
          print('All six published pointers match the validated ZIPs')
          PY
