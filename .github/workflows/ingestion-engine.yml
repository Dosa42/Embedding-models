name: Shared ZIP ingestion engine

on:
  workflow_call:
    inputs:
      model:
        required: true
        type: string
      zip_filename:
        required: false
        type: string
        default: ''
      dtype:
        required: false
        type: string
        default: q8
      chunk_tokens:
        required: false
        type: number
        default: 384
      overlap:
        required: false
        type: number
        default: 64
      batch_size:
        required: false
        type: number
        default: 4

permissions:
  contents: read

concurrency:
  group: ingestion-${{ inputs.model }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-database:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_OFFLINE: '1'
      MODEL: ${{ inputs.model }}
      DTYPE: ${{ inputs.dtype }}
      ZIP_FILENAME: ${{ inputs.zip_filename }}
      CHUNK_TOKENS: ${{ inputs.chunk_tokens }}
      OVERLAP: ${{ inputs.overlap }}
      BATCH_SIZE: ${{ inputs.batch_size }}
    steps:
      - name: Check out ingestion code and uploaded ZIPs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: |
            ingestion
            scripts
            standalone-models/ingestion target
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - name: Install pinned ingestion dependencies
        run: python -m pip install -r ingestion/requirements.txt
      - name: Select ZIP and verify the selected model
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python -m ingestion.prepare --model "$MODEL" --dtype "$DTYPE" \
            --zip-filename "$ZIP_FILENAME" --work "$RUNNER_TEMP/ingestion-work"
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Extract temporarily, chunk and embed into ChromaDB
        env:
          INPUT_ZIP: ${{ steps.prepare.outputs.input_zip }}
          MODEL_DIR: ${{ steps.prepare.outputs.model_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python -m ingestion.build --input "$INPUT_ZIP" --model-dir "$MODEL_DIR" \
            --model "$MODEL" --dtype "$DTYPE" --chunk-tokens "$CHUNK_TOKENS" \
            --overlap "$OVERLAP" --batch-size "$BATCH_SIZE" --threads 2 \
            --output "$RUNNER_TEMP/ingestion-result"
      - name: Publish chunked database release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ingestion-${MODEL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result="$RUNNER_TEMP/ingestion-result"
          gh release create "$tag" --target "$GITHUB_SHA" --draft \
            --title "ChromaDB — ${MODEL} (${DTYPE})" --notes-file "$result/RELEASE.md"
          gh release upload "$tag" "$result"/*.zip "$result/SHA256SUMS.txt" "$result/manifest.json"
          gh release edit "$tag" --draft=false --latest=false
          printf '## Chunked database ready\n\nhttps://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary extracted data
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/ingestion-work" "$RUNNER_TEMP/ingestion-result"
