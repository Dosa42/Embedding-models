name: Build final six INT8 ONNX models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-final-six-int8-models.yml
      - scripts/build_final_six_int8.py
      - scripts/final_six_runtime.py
      - scripts/final_six_int8_models.json
      - scripts/final-six-int8-requirements.txt

permissions:
  contents: read

concurrency:
  group: final-six-int8-standalone-models
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        model:
          - splade-cocondenser-ensembledistil
          - Splade_PP_en_v1
          - efficient-splade-VI-BT-large-query
          - flan-t5-small
          - t5-small
          - opus-mt-nl-en
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/final-six-int8-requirements.txt
      - name: Install SPLADE CPU export dependencies
        if: contains(matrix.model, 'splade') || contains(matrix.model, 'Splade')
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.44.2 huggingface-hub==0.36.2
      - name: Download, convert, validate and package
        env:
          MODEL: ${{ matrix.model }}
        run: python scripts/build_final_six_int8.py --model "$MODEL"
      - uses: actions/upload-artifact@v4
        with:
          name: final-six-int8-${{ matrix.model }}
          path: |
            standalone-models/*-int8-standalone.zip
            standalone-models/package-*.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/final-six-int8-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: final-six-int8-*
          path: standalone-models
          merge-multiple: true
      - name: Verify complete set and ZIP checksums
        run: python scripts/build_final_six_int8.py --finalize
      - name: Publish six standalone ZIPs with Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -c 'import json; print("\n".join(p["name"] for p in json.load(open("standalone-models/final-six-int8-models.lock.json"))["packages"]))' > "$RUNNER_TEMP/final-six-assets.txt"
          while IFS= read -r asset; do
            git add --sparse -- "standalone-models/$asset"
          done < "$RUNNER_TEMP/final-six-assets.txt"
          git add --sparse standalone-models/final-six-int8-models.lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Store six validated SPLADE and seq2seq INT8 ONNX packages'
            git pull --rebase origin main
            git lfs push origin HEAD
            git push origin HEAD:main
          fi
          git fetch origin main
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('standalone-models/final-six-int8-models.lock.json').read_text())
          for item in report['packages']:
              pointer = subprocess.check_output(['git', 'show', 'origin/main:standalone-models/' + item['name']], text=True)
              expected = f"version https://git-lfs.github.com/spec/v1\noid sha256:{item['sha256']}\nsize {item['size']}\n"
              if pointer != expected:
                  raise ValueError('Published pointer mismatch: ' + item['name'])
          print('All six LFS pointers match the verified model archives')
          PY
