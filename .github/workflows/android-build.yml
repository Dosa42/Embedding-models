name: Android build
on:
  push:
    paths:
      - android-app/**
      - .github/workflows/android-build.yml
  pull_request:
    paths:
      - android-app/**
      - .github/workflows/android-build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android-app
            multilingual-e5-small-int8
            all-MiniLM-L6-v2
            fastapi
            langchain/libs/core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python test dependencies
        run: python -m pip install -r android-app/python-requirements.txt ./fastapi ./langchain/libs/core
      - name: Test FastAPI and LangChain retrieval
        run: python -m unittest discover -s android-app/tests -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" < <(yes)
      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: source-atlas-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
